<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Account — MAAYA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    cream:'#FAF5EF', ivory:'#F3ECE2', champagne:'#FFFFFF', gold:'#D4AF37', brown:'#2E2625', maroon:'#6D0016'
  }, fontFamily: { display:['Cormorant Garamond','serif'], heading:['Playfair Display','serif'], body:['DM Sans','sans-serif'] } } } }
</script>
<link rel="stylesheet" href="css/main.css"/>
<style>
  .acc-link { background: #F3ECE2; color: #2E2625; transition: all 200ms; border-radius: 9999px; font-weight: 500; font-size: 0.75rem; padding: 0.65rem 1.2rem; text-align: center; border: 1px solid #E5D5B5; }
  @media (min-width: 768px) {
    .acc-link { border-radius: 4px; background: transparent; text-align: left; padding: 0.75rem 1rem; font-size: 0.875rem; border: none; }
    .acc-link:hover { background: #F3ECE2; color: #6D0016; }
  }
  .acc-link.active{ background:#6D0016 !important; color:#D4AF37 !important; font-weight:700; border-color:#6D0016 !important; }
  .input{ width:100%; background:#FAF5EF; color:#2E2625; border:1px solid #E5D5B5; border-radius:4px; padding:0.75rem 1rem; font-size:0.875rem; outline:none; }
  .input:focus{ border-color:#D4AF37; box-shadow:0 0 0 2px rgba(212,175,55,0.2); }
</style>
</head>
<body class="bg-[#FAF5EF] text-[#2E2625] font-body">

<div id="navbar-root"></div>

<header class="pt-20 md:pt-24 pb-6 max-w-[1300px] mx-auto px-4 md:px-10">
  <h1 class="section-title text-3xl md:text-4xl text-[#6D0016]">My Account</h1>
  <p class="text-[#2E2625]/80 text-sm mt-2">Welcome back, Ananya Sharma</p>
</header>

<section class="max-w-[1300px] mx-auto px-4 md:px-10 pb-20 overflow-hidden">
  <div class="grid md:grid-cols-[220px_1fr] gap-6 md:gap-10 min-w-0">
    <aside class="min-w-0">
      <nav id="acc-nav" class="flex md:flex-col gap-2 overflow-x-auto scrollbar-none py-1"></nav>
    </aside>
    <div id="acc-content" class="min-w-0"></div>
  </div>
</section>

<div id="footer-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/account.js"></script>
</body>
</html>
