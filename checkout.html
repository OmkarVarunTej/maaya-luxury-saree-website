<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Checkout — MAAYA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    cream:'#FAF5EF', ivory:'#F3ECE2', champagne:'#FFFFFF', gold:'#D4AF37', brown:'#2E2625', maroon:'#6D0016'
  }, fontFamily: { display:['Cormorant Garamond','serif'], heading:['Playfair Display','serif'], body:['DM Sans','sans-serif'] } } } }
</script>
<link rel="stylesheet" href="css/main.css"/>
<style>
  .step-dot{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:700; border:1.5px solid rgba(109, 0, 22, 0.3); transition:all 300ms; color:#6D0016; }
  .step-dot.active{ background:#6D0016; color:#D4AF37; border-color:#6D0016; box-shadow:0 0 12px rgba(109, 0, 22, 0.25); }
  .step-dot.done{ background:#FAF5EF; color:#6D0016; border-color:#6D0016; }
  .step-line{ flex:1; height:1.5px; background:rgba(109, 0, 22, 0.2); }
  .step-line.done{ background:#6D0016; }
  .input{ width:100%; background:#FAF5EF; color:#2E2625; border:1px solid #E5D5B5; border-radius:4px; padding:0.75rem 1rem; font-size:0.875rem; outline:none; font-weight:500; }
  .input::placeholder{ color:#8E827E; }
  .input:focus{ border-color:#D4AF37; box-shadow:0 0 0 2px rgba(212, 175, 55, 0.2); }
</style>
</head>
<body class="bg-[#FAF5EF] text-[#2E2625] font-body">

<div id="navbar-root"></div>

<header class="pt-20 md:pt-24 pb-8 max-w-[900px] mx-auto px-6">
  <h1 class="section-title text-3xl md:text-4xl text-center mb-8 text-[#6D0016]">Checkout</h1>
  <div class="flex items-center" id="stepper"></div>
</header>

<section class="max-w-[900px] mx-auto px-6 pb-28">
  <div id="checkout-body"></div>
</section>

<div id="footer-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/checkout.js"></script>
</body>
</html>
