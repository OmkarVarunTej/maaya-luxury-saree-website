<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="doc-title">Product — MAAYA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    cream:'#FAF5EF', ivory:'#F3ECE2', champagne:'#FFFFFF', gold:'#D4AF37', brown:'#2E2625', maroon:'#6D0016'
  }, fontFamily: { display:['Cormorant Garamond','serif'], heading:['Playfair Display','serif'], body:['DM Sans','sans-serif'] } } } }
</script>
<link rel="stylesheet" href="css/main.css"/>
<style>
  .zoom-wrap{ position:relative; overflow:hidden; cursor:zoom-in; }
  .zoom-wrap img{ transition:transform 300ms ease; }
  .zoom-wrap:hover img{ transform:scale(1.6); }
  .tab-btn.active{ color:#6D0016; border-color:#6D0016; font-weight:700; }
  .thumb.active{ border-color:#D4AF37; }
</style>
</head>
<body class="bg-[#FAF5EF] text-[#2E2625] font-body">

<div id="navbar-root"></div>

<div id="product-root" class="pt-24 md:pt-32"></div>

<section class="max-w-[1400px] mx-auto px-6 md:px-10 pb-28">
  <div class="ornament mb-3"><span class="eyebrow text-[#D4AF37]">You May Also Love</span></div>
  <h2 class="section-title text-3xl md:text-4xl text-center mb-12 text-[#6D0016]">Complete The Look</h2>
  <div id="related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-5 md:gap-7"></div>
</section>

<!-- Sticky mobile add-to-cart bar -->
<div id="sticky-bar" class="fixed bottom-0 left-0 right-0 z-40 bg-[#FAF5EF] border-t border-[#E5D5B5] p-4 flex items-center gap-4 lg:hidden translate-y-full transition-transform duration-300">
  <div class="flex-1 min-w-0">
    <div id="sticky-name" class="text-sm font-heading truncate text-[#2E2625]"></div>
    <div id="sticky-price" class="font-sans text-lg font-bold text-[#6D0016]"></div>
  </div>
  <button id="sticky-add" class="btn btn-primary btn-ripple">Add to Cart</button>
</div>

<div id="footer-root"></div>
<div id="toast-root"></div>

<!-- Quick view modal -->
<div id="quickview-modal" class="hidden fixed inset-0 z-[130] items-center justify-center p-4"></div>

<script type="module" src="js/product.js"></script>
</body>
</html>
