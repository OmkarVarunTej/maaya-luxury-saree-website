<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shop All Sarees — MAAYA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    cream:'#FAF5EF', ivory:'#F3ECE2', champagne:'#FFFFFF', gold:'#D4AF37', brown:'#2E2625', maroon:'#6D0016'
  }, fontFamily: { display:['Cormorant Garamond','serif'], heading:['Playfair Display','serif'], body:['DM Sans','sans-serif'] } } } }
</script>
<link rel="stylesheet" href="css/main.css"/>
</head>
<body class="bg-[#FAF5EF] text-[#2E2625] font-body">

<div id="navbar-root"></div>

<header class="pt-20 md:pt-24 pb-10 md:pb-14 max-w-[1400px] mx-auto px-6 md:px-10">
  <nav class="text-xs text-[#D4AF37] mb-4 flex items-center gap-2">
    <a href="index.html" class="hover:text-[#6D0016]">Home</a> <span>/</span> <span id="crumb-current" class="text-[#2E2625]">Shop All</span>
  </nav>
  <h1 id="page-title" class="section-title text-4xl md:text-6xl text-[#6D0016]">Shop All Sarees</h1>
  <p id="page-sub" class="text-[#2E2625]/85 mt-3 max-w-xl font-light">Handwoven silk, cotton, and heritage weaves — curated for the modern wardrobe.</p>
</header>

<section class="max-w-[1400px] mx-auto px-6 md:px-10 pb-28">
  <div class="flex gap-10">

    <!-- FILTER SIDEBAR (desktop) -->
    <aside class="hidden lg:block w-[260px] shrink-0 sticky top-28 h-fit">
      <div id="filters-desktop"></div>
    </aside>

    <div class="flex-1 min-w-0">
      <!-- Toolbar -->
      <div class="flex items-center justify-between gap-4 mb-8 pb-5 border-b border-[#E5D5B5]">
        <button data-filter-toggle class="lg:hidden btn btn-outline text-xs px-4 py-2.5 flex items-center gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Filters
        </button>
        <div id="result-count" class="text-xs md:text-sm text-[#6D0016] font-bold hidden lg:block"></div>
        <div class="flex items-center gap-3 ml-auto">
          <select id="sort-select" class="text-xs md:text-sm border border-[#E5D5B5] rounded-md px-3.5 py-2.5 bg-[#FAF5EF] text-[#2E2625] outline-none focus:border-[#6D0016] cursor-pointer">
            <option value="featured" class="bg-[#FAF5EF] text-[#2E2625]">Sort: Featured</option>
            <option value="new" class="bg-[#FAF5EF] text-[#2E2625]">Newest First</option>
            <option value="price-low" class="bg-[#FAF5EF] text-[#2E2625]">Price: Low to High</option>
            <option value="price-high" class="bg-[#FAF5EF] text-[#2E2625]">Price: High to Low</option>
            <option value="rating" class="bg-[#FAF5EF] text-[#2E2625]">Highest Rated</option>
          </select>
          <div class="hidden md:flex items-center border border-[#E5D5B5] rounded-sm overflow-hidden">
            <button data-view="grid" class="view-btn px-3 py-2.5 text-[#6D0016]" aria-label="Grid view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="3" width="7" height="7" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="14" width="7" height="7" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="14" width="7" height="7" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
            <button data-view="list" class="view-btn px-3 py-2.5 border-l border-[#E5D5B5] text-[#2E2625]" aria-label="List view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="active-chips" class="flex flex-wrap gap-2 mb-6"></div>
      <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-5 md:gap-7"></div>
      <div id="empty-state" class="hidden text-center py-24">
        <p class="font-heading text-2xl mb-2 text-[#6D0016]">No sarees match these filters</p>
        <p class="opacity-80 text-sm mb-6 text-[#2E2625]">Try adjusting or clearing your filters.</p>
        <button id="clear-filters-empty" class="btn btn-outline">Clear All Filters</button>
      </div>
      <div id="pagination" class="flex items-center justify-center gap-2 mt-16"></div>
    </div>
  </div>
</section>

<!-- Mobile filter drawer -->
<div data-filter-drawer class="fixed inset-0 z-[110] translate-x-[-100%] transition-transform duration-500 lg:hidden" style="transition-timing-function:cubic-bezier(.22,1,.36,1)">
  <div class="absolute inset-0 bg-black/50" data-filter-close></div>
  <div class="absolute left-0 top-0 bottom-0 w-[86%] max-w-sm bg-[#FAF5EF] p-6 overflow-y-auto border-r border-[#E5D5B5]">
    <div class="flex justify-between items-center mb-6">
      <span class="font-heading text-xl text-[#6D0016]">Filters</span>
      <button data-filter-close class="p-2 text-[#2E2625] hover:text-[#6D0016]" aria-label="Close filters">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="filters-mobile"></div>
    <button data-filter-close class="btn btn-primary w-full mt-4">Show Results</button>
  </div>
</div>

<div id="footer-root"></div>
<div id="toast-root"></div>

<!-- Quick view modal -->
<div id="quickview-modal" class="hidden fixed inset-0 z-[130] items-center justify-center p-4"></div>

<script type="module" src="js/shop.js"></script>
</body>
</html>
